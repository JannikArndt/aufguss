# Weekly updates for the pinned action SHAs. The only ecosystem here: the app
# has no package.json (CLAUDE.md §2) and no Dockerfile.
# Majors never come from here: a new Node LTS line or framework major is
# moved on purpose. So every PR this opens may merge itself once the checks
# pass (.github/workflows/dependabot-merge.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
