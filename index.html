<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2ec" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufguss">
<meta name="description" content="Aufguss-Journal: welche ätherischen Öle, zu welchem Thema, wann.">
<title>Aufguss</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div id="app">

  <!-- ── Journal ─────────────────────────────────────────────────────────── -->
  <section class="screen" id="scJournal">
    <header class="top">
      <h1>Aufgüsse</h1>
      <button class="icon" id="btnSearchJournal" aria-label="In den Aufgüssen suchen">⌕</button>
    </header>
    <div class="body">
      <div class="field search" id="journalSearchWrap" hidden>
        <input id="journalSearch" type="search" placeholder="Thema, Öl oder Datum" autocomplete="off">
      </div>
      <div id="journalList"></div>
      <p class="empty" id="journalEmpty" hidden>
        Noch kein Aufguss aufgeschrieben.<br>
        Unten auf <b>Neu</b> tippen — Thema wählen, drei Öle suchen, fertig.
      </p>
    </div>
    <nav class="tabs" id="tabsJournal"></nav>
  </section>

  <!-- ── One Aufguss: read and write ─────────────────────────────────────── -->
  <section class="screen" id="scEntry" hidden>
    <header class="top">
      <button class="back" id="entryBack">‹ Zurück</button>
      <h1 id="entryTitle">Neuer Aufguss</h1>
      <button class="icon" id="entryDelete" aria-label="Löschen" hidden>⌫</button>
    </header>
    <div class="body" id="entryBody"></div>
    <div class="foot" id="entryFoot"></div>
  </section>

  <!-- ── The oils ────────────────────────────────────────────────────────── -->
  <section class="screen" id="scOils" hidden>
    <header class="top">
      <h1>Öle</h1>
      <button class="icon" id="btnAddOil" aria-label="Eigenes Öl anlegen">+</button>
    </header>
    <div class="body">
      <div class="field search sticky">
        <input id="oilSearch" type="search" placeholder="Name, Latein, Duftgruppe, Note" autocomplete="off">
      </div>
      <div class="chips" id="oilFilters"></div>
      <div id="oilList"></div>
    </div>
    <nav class="tabs" id="tabsOils"></nav>
  </section>

  <!-- ── One oil ─────────────────────────────────────────────────────────── -->
  <section class="screen" id="scOil" hidden>
    <header class="top">
      <button class="back" id="oilBack">‹ Zurück</button>
      <h1 id="oilTitle">Öl</h1>
      <button class="icon fav" id="oilFav" aria-label="Lieblingsöl">☆</button>
    </header>
    <div class="body" id="oilBody"></div>
  </section>

  <!-- ── Suggestions from favourites and from history ────────────────────── -->
  <section class="screen" id="scMix" hidden>
    <header class="top"><h1>Mischen</h1></header>
    <div class="body" id="mixBody"></div>
    <nav class="tabs" id="tabsMix"></nav>
  </section>

  <!-- ── Settings, export, sources ───────────────────────────────────────── -->
  <section class="screen" id="scMore" hidden>
    <header class="top"><h1>Mehr</h1></header>
    <div class="body" id="moreBody"></div>
    <nav class="tabs" id="tabsMore"></nav>
  </section>

</div>

<div id="notice" role="status" aria-live="polite"></div>
<div id="sheet" hidden><div class="sheet-in" id="sheetIn"></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
